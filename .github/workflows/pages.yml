# Publica o painel (arquivos estáticos) no GitHub Pages a cada push,
# inclusive quando a skill grava um novo dados.enc.json.
name: Publicar painel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true   # se chegarem dados novos, publica só a versão mais recente
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Separar só os arquivos do site
        run: mkdir site && cp index.html estilo.css painel.js .nojekyll site/ && cp dados.enc.json site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
